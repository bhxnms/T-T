name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (without the leading v)'
        required: true
        default: '0.5.3'
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bhxnms/tt-planner

jobs:
  publish:
    name: Build and publish multi-architecture image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            VERSION="${INPUT_TAG#v}"
          elif [[ "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
          else
            echo "::error::A version tag is required"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          MAJOR="${VERSION%%.*}"
          {
            echo "version=$VERSION"
            echo "major=$MAJOR"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A hung npm registry request inside the arm64 emulated build once stalled
      # this step for nearly six hours until the run was cancelled, so the step
      # now carries its own ceiling: a build that cannot finish in an hour is
      # not going to finish, and failing fast leaves the runner free.
      - name: Build and push image
        uses: docker/build-push-action@v6
        timeout-minutes: 60
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.version }}
            NPM_CONFIG_FETCH_RETRIES=5
            NPM_CONFIG_FETCH_RETRY_MINTIMEOUT=20000
            NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT=300000
            NPM_CONFIG_FETCH_TIMEOUT=300000
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.major }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/bhxnms/T-T
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect published image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.tags.outputs.version }}"
