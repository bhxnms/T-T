name: Publish Docker prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease image tag (without the leading v)'
        required: true
        default: '0.4.0-pre.1'
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bhxnms/tt-planner

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate prerelease tag
        id: tags
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pre\.[0-9]+$ ]]; then
            echo "::error::Invalid prerelease version: $VERSION"
            exit 1
          fi
          MAJOR="${VERSION%%.*}"
          {
            echo "version=$VERSION"
            echo "major=${MAJOR}-pre"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prerelease image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.major }}
            ${{ env.IMAGE_NAME }}:latest-pre
          labels: |
            org.opencontainers.image.source=https://github.com/bhxnms/T-T
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect published image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.tags.outputs.version }}"
