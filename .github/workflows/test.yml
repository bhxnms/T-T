name: Tests

permissions:
  contents: read

# The repo's test/quality CI workflow.
#
# Job layout — two tiers:
#   - Preflight: plugin-facts, i18n-parity and the quality jobs
#     (server-quality, client-quality, plugin-sdk-quality) hold the cheap
#     generated-code/typecheck/lint/smoke gates. Every test job `needs:` all
#     of them, so a gate failure stops the run before the expensive coverage
#     fan-out spends ~15 runner-minutes on a result the gates already sank.
#   - Tests: the *-coverage jobs run the suites and upload lcov; s3-contract
#     runs the MinIO contract suite. Coverage jobs run tests only — with the
#     gates cleared in preflight, they can only fail because tests failed.
#   - Fork PRs don't receive secrets, so s3-contract (MINIO_LICENSE_KEY) skips
#     itself. Everything else runs on fork PRs so outside contributors still
#     get the full test signal.
# A push or PR that touches none of these paths can't change the tests,
# so don't spend the coverage fan-out on it. For a docs-only push
# that means no run — harmless, since the tests are still accurate for
# unchanged code. GitHub Actions doesn't support YAML anchors, so the two
# lists are literal copies: keep them identical when editing either one.
on:
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the running one — cancel it
# rather than spending the coverage fan-out on a stale commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-facts:
    name: Plugin Permission Facts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # 22 matches the TREK server runtime (same choice as the plugin-sdk
          # jobs and publish-plugin-sdk.yml).
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace server

      # The plugin permission facts live once, in
      # server/src/nest/plugins/protocol/envelope.ts. Every other copy — the
      # SDK's generated/host-facts.ts and shared's plugin-permissions.ts — is
      # generated from it and checked in, because publish-plugin-sdk builds
      # from a standalone checkout with no server present. This fails the run
      # if a copy drifts, if a new permission has no admin.plugins.perm.*
      # translation, or if the CLI has no hint for it.
      - name: Check the generated plugin facts are in sync
        run: cd server && npm run check:plugin-facts

  i18n-parity:
    name: i18n Key Parity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check i18n key parity
        run: node shared/scripts/i18n-parity.mjs --strict

  server-quality:
    name: Server Types & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Typecheck shared
        # Rides along here rather than in shared-coverage: this job already
        # pays the root install and shared build, and a coverage job may only
        # fail because tests failed (it gates the scan).
        run: cd shared && npm run typecheck

      - name: Build server (tsc -> dist)
        run: cd server && npm run build

      - name: Smoke production require chain
        # Vitest aliases the MCP SDK deep imports, so only this exercises what
        # production runs: the built dist resolving the MCP SDK's subpath
        # exports through the tsconfig-paths/register runtime hook.
        run: cd server && node --require tsconfig-paths/register -e "require('./dist/nest-mcp')"

      - name: Typecheck
        run: cd server && npm run typecheck

      - name: Typecheck tests
        # tests/ is outside the build tsconfig, so a service that grows a
        # constructor parameter does not break its hand-wired call sites at
        # compile time: the argument arrives as undefined and throws at
        # runtime, if anything reads it at all. This is the step that
        # catches it.
        run: cd server && npm run typecheck:tests

      - name: Lint
        run: cd server && npm run lint:check

  client-quality:
    name: Client Types & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace shared && npm ci --workspace client

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Typecheck
        run: cd client && npm run typecheck

      - name: Lint
        run: cd client && npm run lint:check

      - name: Page pattern check
        run: cd client && npm run lint:pages

  plugin-sdk-quality:
    name: Plugin SDK Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-sdk

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # plugin-sdk is standalone (own lockfile, not a root workspace), so it
      # installs from its own directory.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  s3-contract:
    name: S3 Driver Contract (MinIO)
    runs-on: ubuntu-latest
    needs:
      [
        plugin-facts,
        i18n-parity,
        server-quality,
        client-quality,
        plugin-sdk-quality,
      ]
    # Fork PRs do not receive repository secrets. Skip the live AIStor contract
    # job when its license secret is unavailable; hermetic S3 unit tests still run
    # in server-quality for every change.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      MINIO_LICENSE_KEY: ${{ secrets.MINIO_LICENSE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure @swc/core's Linux binary for unplugin-swc
        # The lockfile was generated on Windows and omits @swc/core's Linux
        # optional native binary, so npm ci/install skips it on the runner.
        # Install the matching version explicitly so the server's SWC transform
        # (server/vitest.config.ts) can load.
        run: |
          SWC_VERSION=$(node -p "require('@swc/core/package.json').version")
          npm install --no-save --legacy-peer-deps "@swc/core-linux-x64-gnu@$SWC_VERSION"

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Write MinIO license
        id: license
        run: |
          if [[ -z "$MINIO_LICENSE_KEY" ]]; then
            echo 'MINIO_LICENSE_KEY is not configured; skipping live S3 contract tests.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$MINIO_LICENSE_KEY" > minio-licence.key
          echo 'available=true' >> "$GITHUB_OUTPUT"

      - name: Start MinIO
        if: steps.license.outputs.available == 'true'
        # `services:` can't pass the `server /data --license ...` command to
        # the AIStor image, so it starts via docker run. 127.0.0.1 endpoint is
        # load-bearing: aws-lite picks path-style only for IP/localhost hosts,
        # which is all stock MinIO/AIStor speaks.
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -v "$PWD/minio-licence.key:/minio.license:ro" \
            -e MINIO_ROOT_USER=trekci -e MINIO_ROOT_PASSWORD=trekci-secret \
            quay.io/minio/aistor/minio:RELEASE.2026-08-07T18-34-35Z server /data --license /minio.license

      - name: Wait for MinIO
        if: steps.license.outputs.available == 'true'
        # curl was removed from the AIStor image — poll from the runner instead.
        # 60 x 2s gives a wider margin on cold runners than the 30 x 1s the
        # pre-6fbff835 job used.
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO never became healthy" >&2
          docker logs minio >&2
          exit 1

      - name: Run the S3 driver contract suite
        if: steps.license.outputs.available == 'true'
        # No --coverage: the src/nest/storage/** 94/84/97/94 pin must keep
        # holding from hermetic tests alone. The suite's beforeAll creates
        # the trek-test bucket idempotently — no separate bucket-init step.
        env:
          TREK_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TREK_TEST_S3_BUCKET: trek-test
          TREK_TEST_S3_ACCESS_KEY_ID: trekci
          TREK_TEST_S3_SECRET_ACCESS_KEY: trekci-secret
        run: cd server && npx vitest run tests/unit/nest/storage/s3.driver.contract.test.ts

      - name: Cleanup MinIO
        if: always()
        run: |
          docker rm -f minio 2>/dev/null || true
          rm -f minio-licence.key

  server-coverage:
    name: Server Coverage
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs:
      [
        plugin-facts,
        i18n-parity,
        server-quality,
        client-quality,
        plugin-sdk-quality,
      ]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure @swc/core's Linux binary for unplugin-swc
        # The lockfile was generated on Windows and omits @swc/core's Linux
        # optional native binary, so npm ci/install skips it on the runner.
        # Install the matching version explicitly so the server's SWC transform
        # (server/vitest.config.ts) can load.
        run: |
          SWC_VERSION=$(node -p "require('@swc/core/package.json').version")
          npm install --no-save --legacy-peer-deps "@swc/core-linux-x64-gnu@$SWC_VERSION"

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Run tests with coverage
        run: cd server && npm run test:coverage -- --maxWorkers=2

      - name: Verify coverage outputs
        run: |
          set -euxo pipefail
          test -s server/coverage/lcov.info
          test -s server/coverage/coverage-summary.json
          wc -c server/coverage/lcov.info server/coverage/coverage-summary.json

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: server-coverage
          path: server/coverage/
          if-no-files-found: error
          retention-days: 1

      - name: Diagnose coverage failure
        if: ${{ failure() || cancelled() }}
        run: |
          node --version
          npm --version
          free -h || true
          df -h || true
          ps aux --sort=-%mem | head -20 || true
          find server/coverage -maxdepth 2 -type f -ls 2>/dev/null || true

  client-coverage:
    name: Client Coverage
    runs-on: ubuntu-latest
    needs:
      [
        plugin-facts,
        i18n-parity,
        server-quality,
        client-quality,
        plugin-sdk-quality,
      ]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Only the shared and client workspaces — a full root npm ci is not
      # needed, and the scoped install keeps @testing-library/dom (a peer of
      # @testing-library/react) in the tree without the re-resolution dance
      # the folded coverage job used to need.
      - name: Install dependencies
        run: npm ci --workspace shared && npm ci --workspace client

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Run tests with coverage
        run: cd client && npm run test:coverage

      - name: Verify coverage outputs
        run: |
          set -euxo pipefail
          test -s client/coverage/lcov.info
          test -s client/coverage/coverage-summary.json
          wc -c client/coverage/lcov.info client/coverage/coverage-summary.json

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: client-coverage
          path: client/coverage/
          if-no-files-found: error
          retention-days: 1

      - name: Diagnose coverage failure
        if: ${{ failure() || cancelled() }}
        run: |
          node --version
          npm --version
          free -h || true
          df -h || true
          ps aux --sort=-%mem | head -20 || true
          find client/coverage -maxdepth 2 -type f -ls 2>/dev/null || true

  shared-coverage:
    name: Shared Coverage
    runs-on: ubuntu-latest
    needs:
      [
        plugin-facts,
        i18n-parity,
        server-quality,
        client-quality,
        plugin-sdk-quality,
      ]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace shared

      - name: Run tests with coverage
        run: cd shared && npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: shared-coverage
          path: shared/coverage/
          retention-days: 1

  plugin-sdk-coverage:
    name: Plugin SDK Coverage
    runs-on: ubuntu-latest
    needs:
      [
        plugin-facts,
        i18n-parity,
        server-quality,
        client-quality,
        plugin-sdk-quality,
      ]
    defaults:
      run:
        working-directory: plugin-sdk

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # 22 matches the TREK server runtime and has node:sqlite, which the
          # dev-server tests exercise (same choice as publish-plugin-sdk.yml).
          node-version: 22

      # plugin-sdk is standalone (own lockfile, not a root workspace), so it
      # installs from its own directory.
      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: plugin-sdk-coverage
          path: plugin-sdk/coverage/
          retention-days: 1
