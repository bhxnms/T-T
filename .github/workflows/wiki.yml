name: Deploy Wiki

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'bhxnms/T-T'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Wiki repository
        id: wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh api "repos/${{ github.repository }}" --jq '.has_wiki' 2>/dev/null)" == "true" ]] && git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Wiki is disabled or has not been initialized; wiki deployment was skipped. Enable Wikis and create the first page to publish these documents."
          fi
      - name: Publish to GitHub wiki
        if: steps.wiki.outputs.available == 'true'
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          strategy: clone
          # The Chinese tree stays out of the GitHub wiki.
          #
          # GitHub wikis are FLAT: they address a page by basename, and the action
          # rewrites cross-directory links down to bare names. So `wiki/zh/Home.md`
          # would collide with `wiki/Home.md` and the two would overwrite each
          # other in either direction. The in-app viewer understands directories
          # and serves both languages from the bundled tree, which is the reader
          # that matters here; GitHub gets the canonical English set.
          ignore: zh/**
