name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scout:
    # Build and scan the local image; no registry credentials are required.
    if: github.repository == 'bhxnms/T-T'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trek:scan

      - uses: docker/scout-action@v1
        with:
          command: cves
          image: local://trek:scan
          only-severities: critical,high
          only-fixed: true
          exit-code: true
