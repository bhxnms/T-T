# Default deployment pulls the published multi-arch image. Set SOURCE_BUILD=true
# in .env to build this checkout instead (useful for development/verification).
services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/bhxnms/tt-planner}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: tt-planner
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    ports:
      # Host port is configurable; the container port must stay 3000.
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Encrypts stored secrets (API keys, MFA, SMTP, OIDC). Generate once with
      # `openssl rand -hex 32` and keep it: losing it makes existing secrets
      # unreadable. Unset on a fresh install, the server generates one into
      # data/.encryption_key instead.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Initial admin, applied on first boot only, while no user exists yet.
      # Set both or neither; with neither, an account is created as
      # admin@tt.local and its random password is printed to the server log.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=${TZ:-UTC} # Timezone for logs, reminders and scheduled tasks (e.g. Europe/Berlin)
      - LOG_LEVEL=${LOG_LEVEL:-info} # info = concise user actions; debug = verbose admin-level details
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-} # Comma-separated origins for CORS and email notification links
      - TREK_PLUGIN_HOST_VERSION=${TREK_PLUGIN_HOST_VERSION:-4.2.1}
#      - TREK_WIKI_DIR=/app/wiki # Where the in-app Help pages (/help) read their content from. Leave unset: the image ships the wiki at /app/wiki and finds it automatically. Only set this to serve your own docs, mounted into the container.
#      - DEFAULT_LANGUAGE=en # Default language on the login page for users with no saved preference. Browser/OS language is auto-detected first; this is the fallback. Supported: de, en, es, fr, hu, nl, br, cs, pl, ru, zh, zh-TW, it, ar
#      - SESSION_DURATION=30d # How long users stay logged in. Accepts: 1h | 12h | 7d | 30d | 90d. Default: 24h
#      - SESSION_DURATION_REMEMBER=30d # Session length when "Remember me" is ticked at login. Default: 30d
#      - FORCE_HTTPS=true # Optional. Enables HTTPS redirect, HSTS, CSP upgrade-insecure-requests, and secure cookies behind a TLS proxy
#      - HSTS_INCLUDE_SUBDOMAINS=false # Only effective when HSTS is active. Leave false if sibling subdomains still run over plain HTTP.
#      - COOKIE_SECURE=false # Escape hatch: force session cookies over plain HTTP even in production. Not recommended.
#      - TRUST_PROXY=1 # Trusted proxy count for X-Forwarded-For / X-Forwarded-Proto. Required for FORCE_HTTPS to work.
#      - ALLOW_INTERNAL_NETWORK=false # Set true if Immich or other services are hosted on your local network (RFC-1918 IPs).
#      - HTTP_PROXY=${HTTP_PROXY:-} # Optional. Proxy URL for outbound HTTP requests (e.g. http://192.168.1.10:7890)
#      - HTTPS_PROXY=${HTTPS_PROXY:-} # Optional. Proxy URL for outbound HTTPS requests
#      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1} # Optional. Comma-separated hosts and domains that bypass the outbound proxy
#      - APP_URL=https://planner.example.com # Public base URL — required when OIDC is enabled; also used as base URL for links in email notifications
#      - OIDC_ISSUER=https://auth.example.com # OpenID Connect provider URL
#      - OIDC_CLIENT_ID=tt-planner # OpenID Connect client ID
#      - OIDC_CLIENT_SECRET=<client-secret> # OpenID Connect client secret
#      - OIDC_DISPLAY_NAME=SSO # Label shown on the SSO login button
#      - OIDC_ONLY=false # Set true to force SSO-only mode. No local admin is created then: the first SSO user becomes admin.
#      - OIDC_ADMIN_CLAIM=groups # OIDC claim used to identify admin users
#      - OIDC_ADMIN_VALUE=app-admins # Value of the OIDC claim that grants admin role
#      - OIDC_SCOPE=openid email profile # Fully overrides the default. Add extra scopes as needed (e.g. add groups if using OIDC_ADMIN_CLAIM)
#      - OIDC_DISCOVERY_URL= # Override the OIDC discovery endpoint for providers with non-standard paths (e.g. Authentik)
#      - MCP_RATE_LIMIT=300 # Max MCP API requests per user per minute (default: 300)
#      - MCP_MAX_SESSION_PER_USER=20 # Max concurrent MCP sessions per user (default: 20)
#      - KITINERARY_EXTRACTOR_PATH= # Optional. Full path to the kitinerary-extractor binary. Auto-detected when unset.
#      - LLM_TIMEOUT_MS=900000 # Ceiling (ms) for one AI-parsing call (default: 900000)
#      - DEMO_MODE=false # Demo mode — resets data hourly
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
#      - ./storage-config.json:/app/data/storage-config.json:ro # optional seed-once storage provisioning (wiki: Admin-Storage)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
